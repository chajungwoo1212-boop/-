<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>폼림픽 관리자</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap" style="width:min(1050px,calc(100% - 32px))">
    <section class="card">
      <h1>폼림픽 관리자</h1>
      <p id="meta" class="muted">관리자 키를 입력해주세요.</p>

      <div class="admin-bar">
        <input id="key" type="password" autocomplete="current-password"
               placeholder="ADMIN_KEY">
        <button id="loadBtn">관리자 로그인</button>
      </div>

      <section id="settingsBox"
        style="display:none;margin:26px 0 30px;padding:22px;border:1px solid #e8e8e8;border-radius:10px;">
        <h2 style="margin-bottom:18px;">이벤트 시간 설정</h2>

        <div class="field">
          <label for="targetInput">목표 날짜 / 시간</label>
          <input id="targetInput" type="datetime-local" step="1">
        </div>

        <div class="field">
          <label for="closeInput">00초 이후 접수 유지시간(초)</label>
          <input id="closeInput" type="number" min="1" step="1" value="60">
        </div>

        <div class="actions" style="margin-top:18px;">
          <button id="saveTimeBtn" type="button">시간 저장</button>
          <button id="resetTimeBtn" type="button">기본시간 복원</button>
        </div>

        <div id="settingsMessage" class="message" style="min-height:24px;"></div>
      </section>

      <div class="actions">
        <button id="refreshBtn" disabled>결과 새로고침</button>
        <button id="csvBtn" disabled>CSV 다운로드</button>
      </div>

      <div id="message" class="message"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>닉네임</th>
              <th>식별값</th>
              <th>서버 접수(KST)</th>
              <th>차이</th>
              <th>Request ID</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
let latest = null;
const el = (id) => document.getElementById(id);

function getKey() {
  return el("key").value.trim();
}

function authHeaders() {
  return { Authorization: `Bearer ${getKey()}` };
}

function toDatetimeLocal(ms) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).formatToParts(new Date(ms));

  const obj = Object.fromEntries(parts.map(p => [p.type, p.value]));
  return `${obj.year}-${obj.month}-${obj.day}T${obj.hour}:${obj.minute}:${obj.second}`;
}

function td(text, className = "") {
  const cell = document.createElement("td");
  cell.textContent = text;
  if (className) cell.className = className;
  return cell;
}

function render(data) {
  latest = data;
  el("meta").textContent =
    `${data.title} · 참여 ${data.count}명 · 목표 ${data.targetTime}`;

  const body = el("tbody");
  body.replaceChildren();

  for (const row of data.results) {
    const tr = document.createElement("tr");
    tr.append(
      td(row.rank, "rank"),
      td(row.nickname),
      td(row.uid),
      td(row.receivedAtKST),
      td(`+${row.diffMs} ms`),
      td(row.requestId || "")
    );
    body.appendChild(tr);
  }

  el("refreshBtn").disabled = false;
  el("csvBtn").disabled = data.results.length === 0;
}

async function loadSettings() {
  const r = await fetch("/api/admin-settings", {
    headers: authHeaders(),
    cache: "no-store"
  });

  const data = await r.json();
  if (!r.ok) throw new Error(data.message || "시간 설정 조회 실패");

  el("settingsBox").style.display = "block";
  el("targetInput").value = toDatetimeLocal(data.targetMs);
  el("closeInput").value = Math.round(data.closeAfterMs / 1000);
}

async function loadResults() {
  const r = await fetch("/api/results", {
    headers: authHeaders(),
    cache: "no-store"
  });

  const data = await r.json();
  if (!r.ok) throw new Error(data.message || "결과 조회 실패");
  render(data);
}

async function loginAndLoad() {
  if (!getKey()) {
    el("message").className = "message error";
    el("message").textContent = "관리자 키를 입력해주세요.";
    return;
  }

  sessionStorage.setItem("formlympic_admin_key", getKey());
  el("message").textContent = "불러오는 중...";

  try {
    await Promise.all([loadSettings(), loadResults()]);
    el("message").className = "message ok";
    el("message").textContent = "관리자 인증 완료";
  } catch (e) {
    el("message").className = "message error";
    el("message").textContent = e.message;
  }
}

async function saveTime() {
  const localValue = el("targetInput").value;
  const seconds = Number(el("closeInput").value);

  if (!localValue) {
    el("settingsMessage").className = "message error";
    el("settingsMessage").textContent = "목표 날짜/시간을 입력해주세요.";
    return;
  }

  const targetTime = `${localValue}+09:00`;

  try {
    const r = await fetch("/api/admin-settings", {
      method: "POST",
      headers: {
        ...authHeaders(),
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        targetTime,
        closeAfterMs: seconds * 1000
      })
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.message || "저장 실패");

    el("settingsMessage").className = "message ok";
    el("settingsMessage").textContent =
      "저장 완료. 재배포 없이 참가자 화면과 서버 판정에 반영됩니다.";

    await Promise.all([loadSettings(), loadResults()]);
  } catch (e) {
    el("settingsMessage").className = "message error";
    el("settingsMessage").textContent = e.message;
  }
}

async function resetTime() {
  if (!confirm("Netlify 환경변수 TARGET_TIME 값으로 되돌릴까요?")) return;

  try {
    const r = await fetch("/api/admin-settings", {
      method: "DELETE",
      headers: authHeaders()
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.message || "복원 실패");

    el("targetInput").value = toDatetimeLocal(data.targetMs);
    el("closeInput").value = Math.round(data.closeAfterMs / 1000);
    el("settingsMessage").className = "message ok";
    el("settingsMessage").textContent = data.message;

    await loadResults();
  } catch (e) {
    el("settingsMessage").className = "message error";
    el("settingsMessage").textContent = e.message;
  }
}

function downloadCsv() {
  if (!latest) return;

  const rows = [
    ["순위", "닉네임", "식별값", "서버접수(KST)", "차이(ms)", "Request ID"],
    ...latest.results.map(r => [
      r.rank, r.nickname, r.uid, r.receivedAtKST, r.diffMs, r.requestId || ""
    ])
  ];

  const csv = rows
    .map(row => row.map(value =>
      `"${String(value ?? "").replaceAll('"', '""')}"`
    ).join(","))
    .join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${latest.eventId}-results.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

el("loadBtn").addEventListener("click", loginAndLoad);
el("refreshBtn").addEventListener("click", loadResults);
el("csvBtn").addEventListener("click", downloadCsv);
el("saveTimeBtn").addEventListener("click", saveTime);
el("resetTimeBtn").addEventListener("click", resetTime);
el("key").addEventListener("keydown", e => {
  if (e.key === "Enter") loginAndLoad();
});

const saved = sessionStorage.getItem("formlympic_admin_key");
if (saved) el("key").value = saved;
</script>
</body>
</html>
