<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>폼림픽 관리자</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap" style="width:min(1050px,calc(100% - 32px))">
    <section class="card">
      <h1>폼림픽 관리자</h1>
      <p id="meta" class="muted">관리자 키를 입력해주세요.</p>

      <div class="admin-bar">
        <input id="key" type="password" autocomplete="current-password"
               placeholder="ADMIN_KEY">
        <button id="loadBtn">결과 불러오기</button>
      </div>

      <div class="actions">
        <button id="refreshBtn" disabled>새로고침</button>
        <button id="csvBtn" disabled>CSV 다운로드</button>
      </div>

      <div id="message" class="message"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>닉네임</th>
              <th>식별값</th>
              <th>서버 접수(KST)</th>
              <th>차이</th>
              <th>Request ID</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
let latest = null;
const el = (id) => document.getElementById(id);

function td(text, className = "") {
  const cell = document.createElement("td");
  cell.textContent = text;
  if (className) cell.className = className;
  return cell;
}

function render(data) {
  latest = data;
  el("meta").textContent =
    `${data.title} · 참여 ${data.count}명 · 목표 ${data.targetTime}`;

  const body = el("tbody");
  body.replaceChildren();

  for (const row of data.results) {
    const tr = document.createElement("tr");
    tr.append(
      td(row.rank, "rank"),
      td(row.nickname),
      td(row.uid),
      td(row.receivedAtKST),
      td(`+${row.diffMs} ms`),
      td(row.requestId || "")
    );
    body.appendChild(tr);
  }

  el("refreshBtn").disabled = false;
  el("csvBtn").disabled = data.results.length === 0;
}

async function load() {
  const key = el("key").value;
  if (!key) {
    el("message").className = "message error";
    el("message").textContent = "관리자 키를 입력해주세요.";
    return;
  }

  sessionStorage.setItem("formlympic_admin_key", key);
  el("message").textContent = "불러오는 중...";

  try {
    const r = await fetch("/api/results", {
      headers: { Authorization: `Bearer ${key}` },
      cache: "no-store"
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.message || "결과 조회 실패");

    el("message").className = "message ok";
    el("message").textContent = "결과를 불러왔습니다.";
    render(data);
  } catch (e) {
    el("message").className = "message error";
    el("message").textContent = e.message;
  }
}

function downloadCsv() {
  if (!latest) return;

  const rows = [
    ["순위", "닉네임", "식별값", "서버접수(KST)", "차이(ms)", "Request ID"],
    ...latest.results.map(r => [
      r.rank, r.nickname, r.uid, r.receivedAtKST, r.diffMs, r.requestId || ""
    ])
  ];

  const csv = rows
    .map(row => row.map(value =>
      `"${String(value ?? "").replaceAll('"', '""')}"`
    ).join(","))
    .join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${latest.eventId}-results.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

el("loadBtn").addEventListener("click", load);
el("refreshBtn").addEventListener("click", load);
el("csvBtn").addEventListener("click", downloadCsv);
el("key").addEventListener("keydown", e => {
  if (e.key === "Enter") load();
});

const saved = sessionStorage.getItem("formlympic_admin_key");
if (saved) el("key").value = saved;
</script>
</body>
</html>
