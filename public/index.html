<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>폼림픽</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap">
    <section class="card center">
      <h1 id="title">폼림픽</h1>
      <div id="target" class="muted">이벤트 정보를 불러오는 중...</div>

      <div id="clock" class="clock">--:--:--.---</div>
      <div id="countdown" class="countdown">서버 시간 동기화 중</div>

      <form id="form">
        <div class="field">
          <label for="nickname">DC 닉네임</label>
          <input id="nickname" maxlength="30" autocomplete="nickname"
                 placeholder="닉네임 입력" required>
        </div>

        <div class="field">
          <label for="uid">식별값</label>
          <input id="uid" maxlength="80" autocomplete="off"
                 placeholder="고닉/반고닉 식별용 값" required>
        </div>

        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" tabindex="-1" autocomplete="off">
        </div>

        <button id="submitBtn" type="submit" disabled>시작 전</button>
      </form>

      <div id="message" class="message"></div>

      <section class="leaderboard">
        <div class="leaderboard-head">
          <div>
            <h2>실시간 순위</h2>
            <div class="muted" style="font-size:13px;margin-top:5px;">
              목표 시각 이후 서버 도착 순
            </div>
          </div>
          <div id="rankCount" class="leaderboard-count">0명 참여</div>
        </div>

        <div class="rank-list">
          <div class="rank-row header">
            <div class="rank-num">순위</div>
            <div class="rank-name">닉네임</div>
            <div class="rank-record">기록</div>
          </div>
          <div id="rankBody">
            <div class="empty-rank">아직 참가 기록이 없습니다.</div>
          </div>
        </div>
      </section>

      <div class="note">
        화면 시계는 서버 시간에 맞춰 보정됩니다.<br>
        최종 순위는 PC 시간이 아니라 서버에 도착한 시각으로 판정됩니다.
      </div>
    </section>
  </main>

<script>
let cfg = null;
let offsetMs = 0;
let submitted = false;
let syncing = false;
let rankLoading = false;

const el = (id) => document.getElementById(id);
const submitBtn = el("submitBtn");
const message = el("message");

function serverNow() {
  return Date.now() + offsetMs;
}

function formatClock(ms) {
  const parts = new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    fractionalSecondDigits: 3,
    hour12: false
  }).formatToParts(new Date(ms));

  const obj = Object.fromEntries(parts.map(p => [p.type, p.value]));
  return `${obj.hour}:${obj.minute}:${obj.second}.${obj.fractionalSecond}`;
}

function formatTarget(ms) {
  return new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    year: "numeric",
    month: "long",
    day: "numeric",
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(new Date(ms));
}

async function syncTime(samples = 5) {
  if (syncing) return;
  syncing = true;

  try {
    const candidates = [];

    for (let i = 0; i < samples; i++) {
      const start = Date.now();
      const r = await fetch("/api/time", { cache: "no-store" });
      const data = await r.json();
      const end = Date.now();

      if (!r.ok) throw new Error("시간 동기화 실패");

      const midpoint = (start + end) / 2;
      candidates.push({
        rtt: end - start,
        offset: data.serverTimeMs - midpoint
      });
    }

    candidates.sort((a, b) => a.rtt - b.rtt);
    offsetMs = candidates[0].offset;
  } catch (e) {
    console.warn(e);
  } finally {
    syncing = false;
  }
}

function updateUi() {
  if (!cfg) return;

  const now = serverNow();
  el("clock").textContent = formatClock(now);

  const left = cfg.targetMs - now;
  const closeAt = cfg.targetMs + cfg.closeAfterMs;

  if (submitted) {
    submitBtn.disabled = true;
    submitBtn.textContent = "제출 완료";
    return;
  }

  if (left > 0) {
    submitBtn.disabled = true;
    submitBtn.textContent = "시작 전";
    el("countdown").textContent =
      `시작까지 ${(left / 1000).toFixed(3)}초`;
  } else if (now <= closeAt) {
    submitBtn.disabled = false;
    submitBtn.textContent = "제출하기";
    el("countdown").textContent =
      `진행 중 · 종료까지 ${Math.max(0, (closeAt - now) / 1000).toFixed(3)}초`;
  } else {
    submitBtn.disabled = true;
    submitBtn.textContent = "종료";
    el("countdown").textContent = "이벤트가 종료되었습니다.";
  }
}

function renderRanks(data) {
  el("rankCount").textContent = `${data.count}명 참여`;
  const body = el("rankBody");
  body.replaceChildren();

  if (!data.results || data.results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-rank";
    empty.textContent = "아직 참가 기록이 없습니다.";
    body.appendChild(empty);
    return;
  }

  for (const row of data.results) {
    const line = document.createElement("div");
    line.className = "rank-row" + (row.rank <= 3 ? " top3" : "");

    const rank = document.createElement("div");
    rank.className = "rank-num";
    rank.textContent = row.rank;

    const name = document.createElement("div");
    name.className = "rank-name";
    name.textContent = row.nickname;

    const record = document.createElement("div");
    record.className = "rank-record";
    record.textContent = `+${row.diffMs} ms`;

    line.append(rank, name, record);
    body.appendChild(line);
  }
}

async function loadRanks() {
  if (rankLoading) return;
  rankLoading = true;

  try {
    const r = await fetch("/api/public-results", { cache: "no-store" });
    const data = await r.json();
    if (r.ok) renderRanks(data);
  } catch (e) {
    console.warn("순위 조회 실패", e);
  } finally {
    rankLoading = false;
  }
}

async function loadConfig(initial = false) {
  const r = await fetch("/api/config", { cache: "no-store" });
  const data = await r.json();

  if (!r.ok) throw new Error(data.message || "설정을 불러오지 못했습니다.");

  cfg = data;
  document.title = cfg.title;
  el("title").textContent = cfg.title;
  el("target").textContent = `목표 시각 · ${formatTarget(cfg.targetMs)}`;

  if (initial) {
    await syncTime();
    await loadRanks();
  }

  updateUi();
}
el("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!cfg || submitted) return;

  const nickname = el("nickname").value.trim();
  const uid = el("uid").value.trim();
  const website = el("website").value;

  if (!nickname || !uid) {
    message.className = "message error";
    message.textContent = "닉네임과 식별값을 모두 입력해주세요.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "전송 중...";
  message.textContent = "";

  try {
    const r = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nickname, uid, website })
    });

    const data = await r.json();

    if (!r.ok) {
      throw new Error(data.message || "제출에 실패했습니다.");
    }

    submitted = true;
    message.className = "message ok";
    message.textContent =
      `제출 완료!\n서버 접수: ${data.receivedAtKST}\n기록: +${data.diffMs} ms`;

    await loadRanks();
  } catch (e) {
    message.className = "message error";
    message.textContent = e.message;
    updateUi();
  }
});

setInterval(updateUi, 16);
setInterval(() => syncTime(2), 15000);
setInterval(loadRanks, 2000);
setInterval(() => loadConfig(false).catch(() => {}), 5000);

loadConfig(true).catch((e) => {
  message.className = "message error";
  message.textContent = `설정 오류: ${e.message}`;
  el("countdown").textContent = "Netlify 환경변수를 확인해주세요.";
});
</script>
</body>
</html>
